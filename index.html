<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner Barcode</title>
  <meta name="theme-color" content="#0a2a66">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --biru-900: #0a2a66; --biru-700: #0d47a1; --biru-500: #1e6fd9; --biru-100: #e3edfb;
      --latar: #f2f6fc; --teks: #0f1b2d; --abu: #5b6b82; --garis: #cdd9eb; --salah: #b3261e; --benar: #1b6e2d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--teks); background: var(--latar); }
    header { padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 64px; color: #fff; background: linear-gradient(135deg, var(--biru-900), var(--biru-500)); }
    header h1, header p { max-width: 480px; margin-left: auto; margin-right: auto; }
    header h1 { margin-top: 0; margin-bottom: 4px; font-size: 22px; font-weight: 700; }
    header p { margin-top: 0; margin-bottom: 0; font-size: 14px; opacity: .85; }
    main { max-width: 480px; margin: -44px auto 0; padding: 0 12px 28px; }
    .kartu { margin-bottom: 12px; padding: 12px; background: #fff; border-radius: 16px; box-shadow: 0 6px 20px rgba(10, 42, 102, .12); }

    /* Kamera */
    #kamera { position: relative; height: 150px; overflow: hidden; background: #0a1a33; border-radius: 12px; cursor: pointer; }
    #reader, #reader__scan_region { width: 100%; height: 100% !important; min-height: 0 !important; }
    #reader video { display: block; width: 100% !important; height: 100% !important; object-fit: cover; }
    #reader #qr-shaded-region { border-color: rgba(10, 42, 102, .45) !important; }
    #reader #qr-shaded-region div { background-color: #6fb0ff !important; }
    #pesanKamera { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; overflow: auto; text-align: center; font-size: 13px; line-height: 1.4; color: #cfe0fb; }
    #pesanKamera[hidden] { display: none; }
    .baris-scan { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; min-height: 30px; }
    #statusData { padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--biru-700); background: var(--biru-100); border-radius: 999px; }
    #scanUlang, #btnFoto { padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--biru-700); background: #fff; border: 1.5px solid var(--biru-500); border-radius: 999px; }
    #scanUlang { margin-left: auto; }
    #scanUlang[hidden], #btnFoto[hidden] { display: none; }
    #btnSimpan { display: block; width: 100%; margin-top: 12px; padding: 13px; font-size: 16px; font-weight: 600; color: #fff; background: var(--biru-700); border: 1.5px solid var(--biru-700); border-radius: 12px; }
    #btnSimpan:disabled { opacity: .45; }
    #antrean { padding: 4px 12px; font-size: 13px; font-weight: 600; color: #8a4b00; background: #fff1dc; border-radius: 999px; }
    #antrean[hidden] { display: none; }

    /* Form */
    label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; color: var(--biru-900); }
    label:first-child { margin-top: 2px; }
    input[readonly] { background: #f4f7fc; }
    input[type="text"] { display: block; width: 100%; padding: 13px 14px; font-size: 18px; color: var(--teks); background: #fff; border: 1.5px solid var(--garis); border-radius: 10px; }
    input[type="text"]:focus { outline: none; border-color: var(--biru-500); box-shadow: 0 0 0 3px rgba(30, 111, 217, .22); }
    input::placeholder { color: #9aa8bd; }
    #invoice { letter-spacing: .5px; }
    #catatan { margin-top: 10px; }
    #catatan[hidden] { display: none; }
    #pesan { min-height: 22px; margin: 12px 0 0; font-size: 14px; text-align: center; }
    #pesan.err { color: var(--salah); }
    #pesan.ok { color: var(--benar); }

    /* Pilihan hasil cek */
    .pilih { display: flex; gap: 12px; margin-top: 14px; }
    .pilih button { flex: 1; padding: 12px; font-size: 16px; font-weight: 600; background: #fff; border: 1.5px solid; border-radius: 12px; }
    #btnOke { color: var(--benar); border-color: var(--benar); }
    #btnOke.aktif { color: #fff; background: var(--benar); }
    #btnCek { color: #8a4b00; border-color: #c77700; }
    #btnCek.aktif { color: #fff; background: #c77700; }
    .pilih button:disabled { opacity: .45; }

    /* Tombol */
    .tombol { display: flex; gap: 12px; margin-top: 16px; }
    .tombol button { flex: 1; padding: 14px; font-size: 16px; font-weight: 600; border: 1.5px solid var(--biru-700); border-radius: 12px; }
    #btnPrev { color: var(--biru-700); background: #fff; }
    #btnNext { color: #fff; background: var(--biru-700); }
    .tombol button:disabled { opacity: .45; }
    button:focus-visible { outline: 3px solid var(--biru-500); outline-offset: 2px; }

    /* Pop-up izin kamera */
    .modal { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 26, 51, .65); }
    .modal[hidden] { display: none; }
    .kotak { width: 100%; max-width: 420px; padding: 22px; background: #fff; border-radius: 16px; }
    .kotak h2 { margin: 0 0 8px; font-size: 19px; color: var(--biru-900); }
    .kotak p { margin: 0 0 14px; font-size: 15px; line-height: 1.5; color: var(--teks); }
    .kotak button { display: block; width: 100%; margin-top: 8px; padding: 13px; font-size: 16px; font-weight: 600; border-radius: 12px; border: 1.5px solid transparent; }
    #mIzin { color: #fff; background: var(--biru-700); }
    #mFoto { color: var(--biru-700); background: #fff; border-color: var(--biru-500); }
    #mTutup { color: var(--abu); background: transparent; }
  </style>
</head>
<body>
<header>
  <h1>Scanner Barcode</h1>
  <p>Scan invoice, tekan Simpan, pilih Oke atau Butuh Cek, lalu tekan Next.</p>
</header>
<main>
  <section class="kartu">
    <div id="kamera">
      <div id="reader"></div>
      <div id="pesanKamera">Ketuk di sini untuk mengaktifkan kamera</div>
    </div>
    <div class="baris-scan">
      <span id="statusData">Data baru</span>
      <span id="antrean" hidden></span>
      <button type="button" id="scanUlang" hidden>Scan ulang</button>
      <button type="button" id="btnFoto" hidden>Foto barcode</button>
      <input type="file" id="fileFoto" accept="image/*" capture="environment" hidden>
    </div>
  </section>

  <section class="kartu">
    <label for="invoice">Nomor invoice</label>
    <input type="text" id="invoice" autocomplete="off" placeholder="Hasil scan muncul di sini">

    <button type="button" id="btnSimpan">Simpan</button>

    <div class="pilih">
      <button type="button" id="btnOke" aria-pressed="false">Oke</button>
      <button type="button" id="btnCek" aria-pressed="false">Butuh Cek</button>
    </div>
    <input type="text" id="catatan" maxlength="300" autocomplete="off" placeholder="Tulis catatan: apa yang perlu dicek?" aria-label="Catatan" hidden>

    <p id="pesan" role="status" aria-live="polite"></p>

    <div class="tombol">
      <button type="button" id="btnPrev">Previous</button>
      <button type="button" id="btnNext">Next</button>
    </div>
  </section>
</main>

<div id="modalKamera" class="modal" role="dialog" aria-modal="true" aria-labelledby="mJudul" hidden>
  <div class="kotak">
    <h2 id="mJudul">Izinkan akses kamera</h2>
    <p id="mTeks">Kamera dipakai untuk memindai barcode invoice. Tekan tombol Izinkan kamera, lalu pilih Izinkan pada pop-up browser.</p>
    <button type="button" id="mIzin">Izinkan kamera</button>
    <button type="button" id="mFoto">Pakai foto barcode</button>
    <button type="button" id="mTutup">Ketik manual saja</button>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // ---- State ----
  let records = [];      // invoice yang sudah selesai dicatat pada sesi ini: {invoice, hasil, catatan, nilai}
  let pos = 0;           // posisi saat ini; pos === records.length berarti data baru
  let draft = '';        // isian data baru
  let hasil = '';        // pilihan pada data baru: 'Oke' / 'Butuh Cek'
  let draftHasil = '';   // pilihan yang disimpan saat pindah ke data lama
  let draftCatatan = ''; // catatan yang disimpan saat pindah ke data lama
  let tersimpan = false; // data baru ini sudah masuk spreadsheet
  let nilai = '';        // Nilai Invoice hasil XLOOKUP
  let scanner = null;
  let scannerJalan = false;
  let scannerJeda = false;
  let kodeTerakhir = '';

  const $ = (id) => document.getElementById(id);
  const elInvoice = $('invoice');
  const elCatatan = $('catatan');
  const elPesan = $('pesan');
  const btnPrev = $('btnPrev');
  const btnNext = $('btnNext');
  const modal = $('modalKamera');

  // ---- Konfigurasi ----
  const API_URL = 'https://script.google.com/macros/s/AKfycbyr5j65AWSYjadfUArVllRm2Bo0LT6zQjx-BIH7fjy1fCny00sS1L_nXRbZohWgoaBK/exec';

  function simpanLokal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function bacaLokal(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  // PIN dan nama petugas ditanyakan sekali, lalu diingat di browser ini
  function ambilKredensial() {
    let pin = bacaLokal('pin');
    let nama = bacaLokal('nama');
    if (!pin) { pin = (prompt('Masukkan PIN akses') || '').trim(); simpanLokal('pin', pin); }
    if (!nama) { nama = (prompt('Masukkan nama Anda') || '').trim(); simpanLokal('nama', nama); }
    return { pin, nama };
  }

  async function api(action, data) {
    const k = ambilKredensial();
    const body = Object.assign({ action: action, pin: k.pin, user: k.nama }, data);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    let res;
    try {
      // Tanpa header khusus agar browser tidak mengirim preflight (CORS) ke Apps Script
      res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
    } finally {
      clearTimeout(timer);
    }
    const json = await res.json();
    if (json && json.code === 'PIN') { try { localStorage.removeItem('pin'); } catch (e) {} }
    return json;
  }

  // ---- Antrean kirim hasil cek ----
  // Hanya Oke / Butuh Cek (dan catatan) yang diantrekan; data invoice sudah tersimpan lewat tombol Simpan.
  const KUNCI_ANTREAN = 'antrean_hasil';
  let antrean = (() => {
    try { return JSON.parse(localStorage.getItem(KUNCI_ANTREAN) || '[]'); } catch (e) { return []; }
  })();
  try { localStorage.removeItem('antrean'); } catch (e) {}   // antrean versi lama tidak kompatibel

  function simpanAntrean() {
    try { localStorage.setItem(KUNCI_ANTREAN, JSON.stringify(antrean)); } catch (e) {}
    tampilAntrean();
  }
  function tampilAntrean() {
    const el = $('antrean');
    el.hidden = antrean.length === 0;
    el.textContent = antrean.length + ' hasil menunggu kirim';
  }

  let sedangBilas = false;
  async function bilasAntrean() {
    if (sedangBilas) return;
    sedangBilas = true;
    try {
      while (antrean.length) {
        const paket = antrean.slice(0, 25);
        const res = await api('hasil', { items: paket });
        if (!res || !res.ok) {
          if (res && res.message) tampilPesan(res.message, 'err');
          break;                                       // tetap di antrean, dicoba lagi nanti
        }
        antrean = antrean.slice(paket.length);
        simpanAntrean();
      }
    } catch (e) { /* masih offline, coba lagi nanti */ }
    sedangBilas = false;
  }

  // ---- Utilitas ----
  function tampilPesan(teks, jenis) {
    elPesan.textContent = teks || '';
    elPesan.className = jenis || '';
  }

  // Menandai pilihan Oke / Butuh Cek; kolom catatan hanya tampil untuk Butuh Cek
  function setHasil(h) {
    hasil = h;
    $('btnOke').classList.toggle('aktif', h === 'Oke');
    $('btnCek').classList.toggle('aktif', h === 'Butuh Cek');
    $('btnOke').setAttribute('aria-pressed', String(h === 'Oke'));
    $('btnCek').setAttribute('aria-pressed', String(h === 'Butuh Cek'));
    elCatatan.hidden = h !== 'Butuh Cek';
  }
  $('btnOke').addEventListener('click', () => {
    if (pos !== records.length || !tersimpan) return;
    setHasil('Oke');
    tampilPesan('');
  });
  $('btnCek').addEventListener('click', () => {
    if (pos !== records.length || !tersimpan) return;
    setHasil('Butuh Cek');
    tampilPesan('');
    elCatatan.focus();
  });

  // ---- Kamera / scanner ----
  function buatScanner() {
    if (scanner) return scanner;
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR],
      useBarCodeDetectorIfSupported: true,
      verbose: false
    });
    return scanner;
  }

  function mulaiScanner() {
    if (!window.Html5Qrcode) {
      $('pesanKamera').textContent = 'Library scanner gagal dimuat. Periksa koneksi internet.';
      return;
    }
    buatScanner();
    scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        // Kotak scan lebar dan pendek, cocok untuk barcode batang (1D)
        qrbox: (w, h) => ({ width: Math.floor(w * 0.92), height: Math.max(60, Math.floor(h * 0.8)) })
      },
      saatTerscan,
      () => {}
    ).then(() => {
      scannerJalan = true;
      $('pesanKamera').hidden = true;
    }).catch((err) => {
      $('pesanKamera').textContent =
        'Kamera langsung tidak bisa diakses (' + String(err) + '). Gunakan tombol "Foto barcode" di bawah, atau ketik nomor invoice manual.';
      $('btnFoto').hidden = false;
      bukaModal(pesanError(err));
      console.error(err);
    });
  }

  function jedaScanner(ya) {
    if (!scannerJalan) return;
    try {
      if (ya && !scannerJeda) { scanner.pause(true); scannerJeda = true; }
      if (!ya && scannerJeda) { scanner.resume(); scannerJeda = false; }
    } catch (e) { console.error(e); }
    $('scanUlang').hidden = !(ya && pos === records.length && !tersimpan);
  }

  function saatTerscan(teks) {
    if (pos < records.length || tersimpan) return;   // sedang melihat data lama / data ini sudah tersimpan
    const kode = String(teks).trim();
    if (!kode || kode === kodeTerakhir) return;
    if (records.some((r) => r.invoice === kode)) {
      return tampilPesan('Invoice ' + kode + ' sudah discan pada sesi ini.', 'err');
    }
    kodeTerakhir = kode;
    setHasil('');

    elInvoice.value = kode;
    if (navigator.vibrate) navigator.vibrate(120);
    jedaScanner(true);
    tampilPesan('Barcode terbaca. Tekan Simpan.', 'ok');
  }

  // ---- Tampilan data ----
  function tampilkan() {
    const baru = pos === records.length;
    elInvoice.readOnly = !baru || tersimpan;   // data lama / yang sudah tersimpan tidak bisa diubah
    elCatatan.readOnly = !baru;
    $('btnOke').disabled = !baru || !tersimpan;
    $('btnCek').disabled = !baru || !tersimpan;
    $('btnSimpan').disabled = !baru || tersimpan;
    $('btnSimpan').textContent = (!baru || tersimpan) ? 'Tersimpan' : 'Simpan';
    if (baru) {
      elInvoice.value = draft;
      setHasil(draftHasil);
      elCatatan.value = draftCatatan;
      $('statusData').textContent = tersimpan ? 'Tersimpan, pilih hasil' : 'Data baru';
      kodeTerakhir = draft;
      jedaScanner(!!draft);
    } else {
      elInvoice.value = records[pos].invoice;
      setHasil(records[pos].hasil || '');
      elCatatan.value = records[pos].catatan || '';
      $('statusData').textContent = 'Data ke-' + (pos + 1) + ' dari ' + records.length + ' (sudah dicatat)';
      jedaScanner(true);
    }
    $('scanUlang').hidden = !(baru && scannerJeda && !tersimpan);
    btnPrev.disabled = pos === 0;
    btnNext.disabled = false;
  }

  // ---- Event ----
  $('scanUlang').addEventListener('click', () => {
    kodeTerakhir = '';
    elInvoice.value = '';
    setHasil('');
    tampilPesan('');
    jedaScanner(false);
  });

  // Langkah 1: tombol Simpan menulis Timestamp, No Invoice, Nilai Invoice, User ke spreadsheet
  $('btnSimpan').addEventListener('click', async () => {
    if (pos !== records.length || tersimpan) return;
    const invoice = elInvoice.value.trim();
    if (!invoice) return tampilPesan('Scan barcode atau isi nomor invoice dulu.', 'err');
    if (records.some((r) => r.invoice === invoice)) return tampilPesan('Invoice ini sudah discan pada sesi ini.', 'err');

    draft = invoice;                         // agar tampilkan() tidak menghapus isian
    $('btnSimpan').disabled = true;
    tampilPesan('Menyimpan ke spreadsheet...');
    try {
      let res = await api('simpan', { invoice: invoice });
      if (res && res.code === 'PIN') res = await api('simpan', { invoice: invoice });   // PIN salah: ditanyakan lagi lalu coba ulang
      if (!res || !res.ok) {
        tampilPesan((res && res.message) || 'Gagal menyimpan. Coba lagi.', 'err');
      } else {
        tersimpan = true;
        nilai = String(res.nilai == null ? '' : res.nilai);
        if (nilai === 'Tidak Ditemukan') tampilPesan('Tersimpan, tetapi invoice tidak ada di Master Data. Periksa dulu.', 'err');
        else tampilPesan('Tersimpan. Pilih Oke atau Butuh Cek, lalu Next.', 'ok');
      }
    } catch (e) {
      tampilPesan('Tidak ada koneksi. Menyimpan butuh internet, coba lagi.', 'err');
    }
    $('btnSimpan').disabled = false;
    tampilkan();
  });

  btnPrev.addEventListener('click', () => {
    if (pos === 0) return;
    if (pos === records.length) { draft = elInvoice.value.trim(); draftHasil = hasil; draftCatatan = elCatatan.value; }
    pos--;
    tampilPesan('');
    tampilkan();
  });

  // Langkah 2: setelah tersimpan dan hasil dipilih, Next mengirim hasil cek (dan catatan) lalu lanjut
  btnNext.addEventListener('click', () => {
    if (pos < records.length) {              // data lama hanya dilihat
      pos++;
      tampilPesan('');
      return tampilkan();
    }

    const invoice = elInvoice.value.trim();
    if (!invoice) return tampilPesan('Scan barcode atau isi nomor invoice dulu.', 'err');
    if (!tersimpan) return tampilPesan('Tekan Simpan dulu.', 'err');
    if (!hasil) return tampilPesan('Pilih Oke atau Butuh Cek dulu.', 'err');

    const catatan = hasil === 'Butuh Cek' ? elCatatan.value.trim() : '';
    antrean.push({ invoice: invoice, hasil: hasil, catatan: catatan });
    simpanAntrean();
    records.push({ invoice: invoice, hasil: hasil, catatan: catatan, nilai: nilai });
    draft = ''; draftHasil = ''; draftCatatan = ''; tersimpan = false; nilai = '';
    pos++;
    tampilPesan('Tercatat.', 'ok');
    tampilkan();
    bilasAntrean();
  });

  // ---- Pop-up izin kamera ----
  function bukaModal(teks) {
    if (teks) $('mTeks').textContent = teks;
    modal.hidden = false;
    $('mIzin').focus();
  }
  function tutupModal() { modal.hidden = true; }

  function pesanError(err) {
    const nama = (err && err.name) || '';
    const teks = String(err && err.message ? err.message : err);
    const kode = nama || teks;
    if (/NotAllowed|Permission/i.test(nama + ' ' + teks)) {
      return 'Izin kamera ditolak atau diblokir (' + kode + '). Ketuk ikon di kiri alamat URL > Izin > Kamera > Izinkan, muat ulang halaman, lalu tekan Izinkan kamera lagi. Jika tidak ada pilihan izin sama sekali, browser memblokir kamera di halaman ini. Gunakan Pakai foto barcode.';
    }
    if (/NotFound|Requested device not found/i.test(nama + ' ' + teks)) {
      return 'Kamera tidak ditemukan di perangkat ini (' + kode + ').';
    }
    if (/NotReadable|TrackStart/i.test(nama + ' ' + teks)) {
      return 'Kamera sedang dipakai aplikasi lain (' + kode + '). Tutup aplikasi itu lalu coba lagi.';
    }
    return 'Kamera gagal dibuka (' + kode + '). Gunakan Pakai foto barcode atau ketik nomor invoice manual.';
  }

  async function mintaIzin() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      bukaModal('Browser atau halaman ini tidak mengizinkan akses kamera langsung. Gunakan Pakai foto barcode.');
      $('btnFoto').hidden = false;
      return;
    }
    try {
      // Dipanggil dari ketukan tombol, sehingga browser boleh menampilkan pop-up izin
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      stream.getTracks().forEach((t) => t.stop());
      tutupModal();
      mulaiScanner();
    } catch (err) {
      console.error(err);
      $('btnFoto').hidden = false;
      bukaModal(pesanError(err));
    }
  }

  $('mIzin').addEventListener('click', mintaIzin);
  $('mFoto').addEventListener('click', () => {
    tutupModal();
    $('btnFoto').hidden = false;
    $('fileFoto').click();
  });
  $('mTutup').addEventListener('click', () => {
    tutupModal();
    $('btnFoto').hidden = false;
  });
  $('kamera').addEventListener('click', () => { if (!scannerJalan) bukaModal(); });

  // ---- Cadangan: foto barcode lewat aplikasi kamera bawaan HP ----
  $('btnFoto').addEventListener('click', () => $('fileFoto').click());
  $('fileFoto').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !window.Html5Qrcode) return;
    buatScanner();
    if (pos < records.length) return tampilPesan('Kembali ke data baru dulu (tekan Next).', 'err');
    tampilPesan('Membaca foto...');
    scanner.scanFile(file, false)
      .then((teks) => { kodeTerakhir = ''; saatTerscan(teks); })
      .catch(() => tampilPesan('Barcode tidak terbaca. Foto lebih dekat, tegak lurus, dan pastikan barcode utuh serta fokus.', 'err'));
  });

  // ---- Mulai ----
  window.addEventListener('load', () => {
    ambilKredensial();
    tampilkan();
    tampilAntrean();
    bukaModal();
    bilasAntrean();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
  window.addEventListener('online', bilasAntrean);
</script>
</body>
</html>
